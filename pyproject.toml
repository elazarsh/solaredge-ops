[project]
name = "solaredge-ops"
version = "0.1.0"
description = "Custom monitoring, alerting, and reporting tools for SolarEdge PV fleets"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "PyYAML>=6.0",
]

[project.scripts]
solaredge-ops = "solaredge_ops.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["solaredge_ops*"]
