<!doctype html>
<html lang="he">
  <!--
    Ep2 "היומן" v4: Michal's own planner, phone SCREEN only (1080×2590, aspect of the tracked Veo screen ≈ 2.39).
    Rendered alone, then perspective-warped onto the green screen of the hand footage (gen/composite.py).
    Times are the FINAL video's seconds (T below; keep in sync with ../edl.json, ../index.html and gen/foley.py).
    No calendar years anywhere: the kids' follow-ups are set by the child's AGE, Michal's own by her TENURE.
    Dictation (not typing) fills the notes word by word; the age counter and the dictated text are pure functions
    of time (seek-safe). RTL navigation: a new page enters from the left. Never put dir="rtl" on <html>.
  -->
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=2590" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face { font-family: "Heebo"; src: url("assets/fonts/Heebo-VF.ttf"); font-weight: 100 900; }
      @font-face { font-family: "Rubik"; src: url("assets/fonts/Rubik-VF.ttf"); font-weight: 300 900; }
      @font-face { font-family: "Emoji"; src: url("assets/fonts/NotoColorEmoji.ttf"); }
      :root { --ink: #1F1F1F; --sub: #5F6368; --line: #E3E3E3; --acc: #1A73E8; --bg: #FFFFFF;
              --c0: #F4C7D0; --c0d: #B4365A; --c1: #CFE0FB; --c1d: #1F5FBF; --c2: #CDEFD5; --c2d: #1E7B3C; --c3: #FFE1B8; --c3d: #B25E09; --c4: #E7DDF7; --c4d: #6A3FB5; --c5: #FFF1B8; --c5d: #8A6A00; }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 2590px; overflow: hidden; background: #000; }
      #root { position: relative; width: 1080px; height: 2590px; overflow: hidden; font-family: "Heebo", "Emoji", sans-serif; color: var(--ink); }
      .ltr { direction: ltr; unicode-bidi: isolate; display: inline-block; }
      .h { opacity: 0; }
      .pane { position: absolute; inset: 0; overflow: hidden; background: var(--bg); }
      .sbar { position: absolute; left: 0; right: 0; top: 0; height: 110px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 90px 14px; font-size: 44px; font-weight: 700; z-index: 6; }
      /* bottom tabs (reminders list + day view) */
      .tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 230px; border-top: 2px solid var(--line); background: #fff; display: flex; direction: rtl; z-index: 5; }
      .tab { flex: 1; text-align: center; padding-top: 34px; font-size: 40px; color: var(--sub); font-weight: 600; position: relative; }
      .tab i { display: block; font-style: normal; font-size: 64px; margin-bottom: 4px; }
      .tab.on { color: var(--acc); font-weight: 800; }
      .tab .tp { position: absolute; inset: 14px 30px; border-radius: 40px; background: rgba(26,115,232,.14); opacity: 0; }
      .ptitle { position: absolute; top: 130px; right: 60px; left: 60px; direction: rtl; }
      .ptitle b { display: block; font-family: "Rubik", "Emoji"; font-size: 84px; font-weight: 800; }
      .ptitle span { display: block; font-size: 44px; color: var(--sub); margin-top: 6px; }

      /* ---------- reminders list (opening) ---------- */
      .rrow { position: absolute; left: 50px; right: 50px; height: 230px; border-radius: 34px; display: flex; align-items: center; gap: 34px; padding: 0 40px; direction: rtl; }
      .rrow .age { width: 170px; height: 170px; border-radius: 50%; background: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: "Rubik", "Emoji"; font-weight: 800; font-size: 40px; line-height: 1.1; flex: none; }
      .rrow .age b { font-size: 72px; }
      .rrow .tx b { display: block; font-size: 58px; font-weight: 800; white-space: nowrap; }
      .rrow .tx span { display: block; font-size: 44px; opacity: .85; white-space: nowrap; }
      .rrow .bell { margin-inline-start: auto; font-size: 60px; }

      /* ---------- day view ---------- */
      .dtop { position: absolute; top: 110px; left: 0; right: 0; height: 300px; padding: 30px 60px 0; direction: rtl; border-bottom: 2px solid var(--line); }
      .dtop .who { font-size: 46px; color: var(--sub); font-weight: 600; }
      .dtop .d { font-family: "Rubik"; font-size: 84px; font-weight: 800; margin-top: 6px; }
      .dtop .d i { font-style: normal; color: var(--acc); }
      .grid { position: absolute; top: 440px; left: 0; right: 0; height: 1900px; direction: rtl; }
      .hr { position: absolute; right: 0; left: 0; height: 2px; }
      .hr span { position: absolute; right: 30px; top: -26px; font-size: 38px; color: var(--sub); direction: ltr; }
      .hr::after { content: ""; position: absolute; right: 170px; left: 0; top: 0; height: 2px; background: var(--line); }
      .blk { position: absolute; right: 180px; left: 30px; border-radius: 24px; padding: 14px 30px; overflow: hidden; direction: rtl; }
      .blk b { display: block; font-size: 58px; font-weight: 800; line-height: 1.15; white-space: nowrap; }
      .blk span { display: block; font-size: 40px; font-weight: 500; opacity: .85; white-space: nowrap; }
      .blk .bdg { position: absolute; left: 24px; top: 14px; font-size: 50px; opacity: 0; }
      .blk .hl { position: absolute; inset: 0; background: rgba(0,0,0,.12); opacity: 0; }
      .mine { position: absolute; left: 60px; right: 60px; bottom: 270px; height: 190px; border-radius: 40px; background: linear-gradient(90deg, #E8F0FE, #D2E3FC); display: flex; align-items: center; gap: 30px; padding: 0 46px; direction: rtl; font-size: 58px; font-weight: 800; color: #174EA6; }
      .mine i { font-style: normal; font-size: 70px; }
      .mine .ch { margin-inline-start: auto; font-size: 60px; }
      .mine .hl { position: absolute; inset: 0; border-radius: 40px; background: rgba(0,0,0,.1); opacity: 0; }

      /* ---------- event detail ---------- */
      .ev .band { position: absolute; top: 0; left: 0; right: 0; height: 640px; padding: 110px 60px 0; direction: rtl; }
      .ev .bar { display: flex; justify-content: space-between; align-items: center; height: 140px; font-size: 64px; }
      .ev .ico { font-size: 110px; line-height: 1; margin-top: 6px; }
      .ev .ttl { font-family: "Rubik", "Emoji"; font-size: 92px; font-weight: 800; line-height: 1.1; margin-top: 20px; white-space: nowrap; }
      .ev .when { font-size: 46px; margin-top: 12px; opacity: .85; white-space: nowrap; }
      .ev .rows { position: absolute; top: 680px; left: 60px; right: 60px; direction: rtl; }
      .ev .loc { display: flex; gap: 30px; align-items: center; font-size: 56px; font-weight: 800; padding: 20px; margin: 0 -20px; border-radius: 20px; white-space: nowrap; }
      .ev .nl { font-size: 44px; color: var(--sub); font-weight: 700; margin: 40px 0 18px; display: flex; gap: 20px; align-items: center; }
      .ev .note { position: relative; background: #FFF8E1; border-radius: 34px; padding: 34px 40px; min-height: 330px; }
      .ev .note .mic { position: absolute; left: 30px; top: 26px; width: 110px; height: 110px; border-radius: 50%; background: #EA4335; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 56px; }
      .ev .note .ok { position: absolute; left: 30px; top: 26px; width: 110px; height: 110px; border-radius: 50%; background: #34A853; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 64px; font-weight: 800; opacity: 0; }
      .ev .note .tm { font-size: 46px; color: #A66B00; font-weight: 800; margin-bottom: 8px; }
      .ev .note .txt { font-size: 66px; font-weight: 700; line-height: 1.3; padding-left: 130px; min-height: 172px; }
      .ev .rbtn { position: relative; margin-top: 46px; border: 4px solid var(--acc); color: var(--acc); border-radius: 40px; padding: 34px 40px; display: flex; align-items: center; justify-content: center; gap: 24px; font-size: 60px; font-weight: 800; overflow: hidden; }
      .ev .rbtn .hl { position: absolute; inset: 0; background: rgba(26,115,232,.16); opacity: 0; }
      /* the follow-up sheet */
      .sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 1500px; background: #fff; border-radius: 60px 60px 0 0; box-shadow: 0 -20px 60px rgba(0,0,0,.18); direction: rtl; text-align: center; padding: 30px 70px 0; z-index: 8; }
      .sheet .grab { width: 140px; height: 12px; border-radius: 6px; background: #D1D7DB; margin: 0 auto 40px; }
      .sheet .k { font-size: 50px; font-weight: 800; color: var(--sub); }
      .sheet .ageL { font-family: "Rubik", "Emoji"; font-size: 84px; font-weight: 800; margin-top: 40px; }
      .sheet .ageN { font-family: "Rubik"; font-size: 300px; font-weight: 800; line-height: 1; margin-top: 10px; }
      .sheet .msg { font-family: "Rubik", "Emoji"; font-size: 80px; font-weight: 800; line-height: 1.25; margin-top: 50px; }
      .sheet .msg span { display: block; }
      .sheet .saved { display: inline-flex; gap: 20px; align-items: center; margin-top: 60px; font-size: 50px; font-weight: 800; color: #188038; background: #E6F4EA; border-radius: 50px; padding: 18px 46px; }

      /* ---------- my follow-ups ---------- */
      #mine .band { position: absolute; top: 0; left: 0; right: 0; height: 520px; padding: 110px 60px 0; direction: rtl; background: linear-gradient(160deg, #D2E3FC, #E8F0FE); color: #174EA6; }
      #mine .band b { display: block; font-family: "Rubik", "Emoji"; font-size: 100px; font-weight: 800; margin-top: 150px; }
      #mine .band span { display: block; font-size: 48px; font-weight: 600; margin-top: 10px; }
      .mrow { position: absolute; left: 50px; right: 50px; border-radius: 30px; padding: 26px 34px; direction: rtl; display: flex; gap: 30px; align-items: center; }
      .mrow i { font-style: normal; font-size: 70px; width: 90px; text-align: center; flex: none; }
      .mrow .w { font-size: 42px; color: var(--sub); font-weight: 800; display: block; }
      .mrow .v { font-size: 58px; font-weight: 800; display: block; line-height: 1.2; }
      .stairs { position: absolute; left: 40px; top: 40px; width: 260px; height: 190px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="51.8" data-width="1080" data-height="2590">
      <div id="ui" class="clip" data-start="0" data-duration="51.8" data-track-index="0" data-layout-allow-overlap></div>
    </div>

    <script>
      // ---- the edit (final-video seconds); keep in sync with ../edl.json, ../index.html and gen/foley.py ----
      const T = window.T = {
        toDay: 4.3, tapBlk: 5.6, ev0: 5.85,
        K: [7.5, 14.0, 20.5, 27.0], dict0: 0.4, dict1: 2.2, okAt: 2.45, tapR: 2.8, sheetAt: 3.0, roll0: 3.35, roll1: 4.15, msgAt: 4.25, savedAt: 5.3, swipeAt: 6.05,
        backDay: 33.05, tapMine: 38.6, mine: 38.8, mineStep: 1.05, end: 51.8,
      };
      const ease = "power2.inOut";
      const KIDS = [
        { n: "יואב", g: "בן", from: 2, to: 6, t: "קבלת הפעוטות", tm: "07:30–09:00", s: [7, 30], e: [9, 0], ico: "❤️", c: "c0", at: "07:42",
          note: "יואב נפרד מאבא בחיוך. פעם ראשונה! ❤️", msg: ["עולה לכיתה א'.", "לשלוח לו ברכה 💌"], list: "כיתה א' · לשלוח ברכה 💌" },
        { n: "נועה", g: "בת", from: 2, to: 7, t: "מפגש בוקר", tm: "09:00–10:15", s: [9, 0], e: [10, 15], ico: "🗣️", c: "c1", at: "09:20",
          note: "נועה אמרה היום 3 מילים חדשות: עוד, שלי, כלב 🗣️", msg: ["קוראת לבד ספר ראשון?", "לשאול את אמא 📚"], list: "ספר ראשון לבד? 📚" },
        { n: "אורי", g: "בן", from: 2, to: 6, t: "חצר", tm: "10:30–11:45", s: [10, 30], e: [11, 45], ico: "🤸", c: "c2", at: "10:45",
          note: "אורי טיפס לבד עד הסוף 🤸", msg: ["כותב את השם שלו?", "✏️"], list: "כותב את השם שלו? ✏️" },
        { n: "תמר", g: "בת", from: 2, to: 15, t: "ארוחת צהריים", tm: "12:00–13:00", s: [12, 0], e: [13, 0], ico: "🤝", c: "c3", at: "12:10",
          note: "תמר חיכתה לתור, וחלקה בעצמה 🤝", msg: ["מדריכה בתנועת הנוער?", "לבוא לפעולה שלה 💛"], list: "מדריכה? לבוא לפעולה 💛" },
      ];
      const ui = document.getElementById("ui");
      const sbar = (tm) => `<div class="sbar"><span class="ltr">${tm}</span><span class="ltr">5G ▮▮▮ 92%</span></div>`;
      const tabs = (on) => `<div class="tabs">${[["📅", "היום", "d"], ["🔔", "תזכורות", "r"], ["🔁", "המעקב שלי", "m"]].map(([i, l, k]) => `<div class="tab ${on === k ? "on" : ""}" id="tab-${on}-${k}"><div class="tp"></div><i>${i}</i>${l}</div>`).join("")}</div>`;

      // ---- reminders list (the opening) ----
      const REM = [
        ["יואב", "בן", 6, KIDS[0].list, "c0"], ["אורי", "בן", 6, KIDS[2].list, "c2"], ["נועה", "בת", 7, KIDS[1].list, "c1"],
        ["אליה", "בן", 9, "מתחיל לרכוב בלי גלגלי עזר? 🚲", "c4"], ["הודיה", "בת", 12, "הופעה ראשונה בכינור 🎻", "c5"], ["תמר", "בת", 15, KIDS[3].list, "c3"],
      ];
      ui.insertAdjacentHTML("beforeend", `<div class="pane" id="rem" style="z-index:2">${sbar("6:52")}
        <div class="ptitle"><b>🔔 תזכורות מעקב</b><span>מסודרות לפי גיל</span></div>
        <div id="remList">${REM.map(([n, g, a, l, c], k) => `<div class="rrow" style="top:${430 + k * 270}px; background:var(--${c}); color:var(--${c}d)"><div class="age"><b>${a}</b>🎂</div><div class="tx"><b>כש${n} ${g} ${a}</b><span>${l}</span></div><div class="bell">🔔</div></div>`).join("")}</div>
        ${tabs("r")}</div>`);

      // ---- day view ----
      const PX = 165, y = (h, m = 0) => (h - 7 + m / 60) * PX + 30;
      let grid = ""; for (let h = 7; h <= 16; h++) grid += `<div class="hr" style="top:${y(h)}px"><span>${String(h).padStart(2, "0")}:00</span></div>`;
      const blk = (o, id) => `<div class="blk" id="${id}" style="top:${y(...o.s) + 3}px; height:${y(...o.e) - y(...o.s) - 8}px; background:var(--${o.c}); color:var(--${o.c}d)"><div class="hl"></div><div class="bdg">📝🔔</div><b>${o.t} ${o.ico}</b><span class="ltr" style="text-align:right">${o.tm}</span></div>`;
      KIDS.forEach((o, i) => (grid += blk(o, "b" + i)));
      grid += blk({ t: "מנוחה", ico: "😴", tm: "13:00–14:30", s: [13, 0], e: [14, 30], c: "c4" }, "bx1");
      grid += blk({ t: "השתלמות מקצועית", ico: "🎓", tm: "16:00", s: [15, 50], e: [16, 40], c: "c5" }, "bx2");
      ui.insertAdjacentHTML("beforeend", `<div class="pane" id="day" style="z-index:3">${sbar("6:53")}
        <div class="dtop"><div class="who">📒 היומן של מיכל · מטפלת</div><div class="d">יום שני, <i>12 באוקטובר</i></div></div>
        <div class="grid">${grid}</div>
        <div class="mine" id="mineBtn"><div class="hl"></div><i>🔁</i>המעקב שלי<span class="ch">‹</span></div>
        ${tabs("d")}</div>`);

      // ---- one detail page per child (with its follow-up sheet) ----
      KIDS.forEach((o, i) => {
        ui.insertAdjacentHTML("beforeend", `<div class="pane ev" id="ev${i}" style="z-index:${10 + i}">${sbar(["6:54", "6:55", "6:55", "6:56"][i])}
          <div class="band" style="background:var(--${o.c}); color:var(--${o.c}d)">
            <div class="bar"><span>✕</span><span style="font-size:54px">✎ ⋮</span></div>
            <div class="ico">${o.ico}</div><div class="ttl">${o.t}</div>
            <div class="when">יום שני, 12 באוקטובר · <span class="ltr">${o.tm}</span></div>
          </div>
          <div class="rows">
            <div class="loc" id="loc${i}">📍 מעון הר ברכה · כיתת הפעוטות</div>
            <div class="nl">📝 עדכונים</div>
            <div class="note"><div class="mic" id="mic${i}">🎙️</div><div class="ok" id="ok${i}">✓</div><div class="tm ltr">${o.at}</div><div class="txt" id="tx${i}"></div></div>
            <div class="rbtn" id="rb${i}"><div class="hl" id="rbh${i}"></div>🔔 תזכורת מעקב ל${o.n}</div>
          </div>
          <div class="sheet" id="sh${i}">
            <div class="grab"></div><div class="k">🔔 תזכורת מעקב · ${o.n}</div>
            <div class="ageL">🎂 כש${o.n} ${o.g}</div>
            <div class="ageN" id="ag${i}" style="color:var(--${o.c}d)">${o.from}</div>
            <div class="msg">${o.msg.map((l, k) => `<span class="h" id="m${i}${k}">${l}</span>`).join("")}</div>
            <div class="saved h" id="sv${i}">✓ התזכורת נשמרה</div>
          </div></div>`);
      });

      // ---- my follow-ups ----
      const MINE = [
        ["🎓", "השבוע", "השתלמות מקצועית", "c5"],
        ["💰", "כל חודש", "<span class=\"ltr\">45 ₪</span> לשעה עם תעודה", "c2"],
        ["🧾", "כל חודש", "חצי מבונוס ההתמדה נכנס לבסיס", "c2"],
        ["📈", "יום השנה ה־3 שלי 🎉 · ושוב ב־9 וב־12", "קפיצת שכר!", "c1"],
        ["💼", "שנה 5", "קרן השתלמות", "c4"],
        ["🏆", "כל הזמן", "מהתנאים הגבוהים בשומרון", "c3"],
      ];
      const stairs = `<svg class="stairs" viewBox="0 0 260 190">${[0, 1, 2, 3].map((k) => `<rect id="st${k}" x="${10 + k * 62}" y="${170 - (k + 1) * 40}" width="54" height="${(k + 1) * 40}" rx="10" fill="#1F5FBF" opacity="${k ? 0.12 : 0.35}"/>`).join("")}<path id="arr" d="M20 150 L230 20 M230 20 L195 25 M230 20 L222 55" stroke="#188038" stroke-width="12" fill="none" stroke-linecap="round" opacity="0"/></svg>`;
      ui.insertAdjacentHTML("beforeend", `<div class="pane" id="mine" style="z-index:20">${sbar("6:57")}
        <div class="band"><b>🔁 המעקב שלי</b><span>גם על העתיד שלי מישהו חושב 🙂</span></div>
        ${MINE.map(([i, w, v, c], k) => `<div class="mrow" id="mr${k}" style="top:${580 + k * 290}px; height:260px; background:var(--${c}); color:var(--${c}d)"><i>${i}</i><div><span class="w">${w}</span><span class="v">${v}</span></div>${k === 3 ? stairs : ""}</div>`).join("")}
      </div>`);

      // ---------------- timeline ----------------
      const tl = gsap.timeline({ paused: true });
      const rgbY = (a) => `rgba(255,225,77,${a})`;
      tl.set("#day", { xPercent: -100 }, 0);
      tl.set([...KIDS.map((o, i) => "#ev" + i), "#mine"], { xPercent: -100 }, 0);
      KIDS.forEach((o, i) => tl.set("#sh" + i, { yPercent: 105 }, 0));
      // the opening list drifts gently (the finger touches it on the counter)
      tl.fromTo("#remList", { y: 0 }, { y: -120, duration: 2.0, ease: "sine.inOut", immediateRender: false }, 1.6);
      // → today
      tl.to("#tab-r-d .tp", { opacity: 1, duration: 0.1 }, T.toDay - 0.15);
      tl.to("#day", { xPercent: 0, duration: 0.45, ease }, T.toDay);
      tl.to("#rem", { xPercent: 30, duration: 0.45, ease }, T.toDay);
      tl.to("#b0 .hl", { opacity: 1, duration: 0.1 }, T.tapBlk);
      tl.to("#ev0", { xPercent: 0, duration: 0.45, ease }, T.ev0);
      tl.to("#day", { xPercent: 30, duration: 0.45, ease }, T.ev0);
      tl.set("#b0 .hl", { opacity: 0 }, T.ev0 + 0.5);
      tl.fromTo("#loc0", { backgroundColor: rgbY(0) }, { backgroundColor: rgbY(0.6), duration: 0.3, immediateRender: false }, T.ev0 + 0.35);
      tl.to("#loc0", { backgroundColor: rgbY(0), duration: 0.4 }, T.K[0] + 0.3);

      const dict = [], rolls = [];
      KIDS.forEach((o, i) => {
        const K = T.K[i];
        if (i > 0) { // swipe: the finger moves right → left, the next child's page comes in from the right
          tl.set("#ev" + i, { xPercent: 100 }, K - 0.5);
          tl.to("#ev" + i, { xPercent: 0, duration: 0.5, ease }, K - 0.45);
          tl.to("#ev" + (i - 1), { xPercent: -100, duration: 0.5, ease }, K - 0.45);
        }
        dict.push({ i, a: K + T.dict0, b: K + T.dict1, words: o.note.split(" ") });
        tl.fromTo("#mic" + i, { scale: 1 }, { scale: 1.12, duration: 0.3, yoyo: true, repeat: 5, ease: "sine.inOut", immediateRender: false }, K + 0.2);
        tl.to("#mic" + i, { opacity: 0, duration: 0.2 }, K + T.okAt);
        tl.to("#ok" + i, { opacity: 1, duration: 0.2 }, K + T.okAt);
        tl.to("#rbh" + i, { opacity: 1, duration: 0.1 }, K + T.tapR);
        tl.to("#sh" + i, { yPercent: 0, duration: 0.45, ease: "power2.out" }, K + T.sheetAt);
        rolls.push({ i, a: K + T.roll0, b: K + T.roll1, from: o.from, to: o.to });
        tl.fromTo("#m" + i + "0", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, K + T.msgAt);
        tl.fromTo("#m" + i + "1", { y: 24, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out", immediateRender: false }, K + T.msgAt + 0.45);
        tl.fromTo("#sv" + i, { scale: 0.9, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2)", immediateRender: false }, K + T.savedAt);
        tl.set(`#b${i} .bdg`, { opacity: 1 }, K + T.savedAt);   // the day view gets its 📝🔔 badge
      });
      const words = (now) => dict.forEach((d) => {
        const p = Math.min(1, Math.max(0, (now - d.a) / (d.b - d.a)));
        const n = Math.round(p * d.words.length);
        document.getElementById("tx" + d.i).textContent = d.words.slice(0, n).join(" ");
      });
      const ages = (now) => rolls.forEach((r) => {
        const p = Math.min(1, Math.max(0, (now - r.a) / (r.b - r.a))), e = 1 - Math.pow(1 - p, 2);
        document.getElementById("ag" + r.i).textContent = r.from + Math.round(e * (r.to - r.from));
      });

      // back to the whole day (now full of notes and bells)
      tl.set("#day", { xPercent: 100 }, T.backDay - 0.05);
      tl.to("#day", { xPercent: 0, duration: 0.5, ease }, T.backDay);
      tl.to("#ev3", { xPercent: -100, duration: 0.5, ease }, T.backDay);
      // → my follow-ups
      tl.to("#mineBtn .hl", { opacity: 1, duration: 0.1 }, T.tapMine);
      tl.to("#mine", { xPercent: 0, duration: 0.45, ease }, T.mine);
      tl.to("#day", { xPercent: 30, duration: 0.45, ease }, T.mine);
      MINE.forEach((m, k) => {
        const at = T.mine + 0.6 + k * T.mineStep;
        tl.fromTo("#mr" + k, { boxShadow: "0 0 0 0 rgba(255,200,0,0)" }, { boxShadow: "0 0 0 10px rgba(255,200,0,.9)", duration: 0.25, immediateRender: false }, at);
        if (k < MINE.length - 1) tl.to("#mr" + k, { boxShadow: "0 0 0 0 rgba(255,200,0,0)", duration: 0.3 }, at + T.mineStep - 0.1);
      });
      const S = T.mine + 0.6 + 3 * T.mineStep;   // the stairs climb while the tenure row is lit
      [1, 2, 3].forEach((k) => tl.to("#st" + k, { opacity: 0.35 + k * 0.2, duration: 0.25 }, S + 0.15 + (k - 1) * 0.3));
      tl.to("#st0", { opacity: 0.55, duration: 0.2 }, S + 0.1);
      tl.to("#arr", { opacity: 1, duration: 0.3 }, S + 1.0);

      const clock = { v: 0 };
      tl.to(clock, { v: 1, duration: T.end, ease: "none", onUpdate: () => { const n = tl.time(); words(n); ages(n); } }, 0);
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
