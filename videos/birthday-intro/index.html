<!doctype html>
<html lang="he" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
      :root {
        --cream: #fefdf9;
        --gold: #b58a3c;
      }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: var(--cream); }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: var(--cream); }

      /* ---------- background: soft watercolour washes in the portrait's palette ---------- */
      #bg { position: absolute; inset: 0; }
      .wash { position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0; }
      #w1 { left: -260px; top: -180px; width: 880px; height: 700px; background: radial-gradient(closest-side, rgba(205,220,186,.85), rgba(205,220,186,0)); }
      #w2 { left: -200px; top: 640px; width: 760px; height: 640px; background: radial-gradient(closest-side, rgba(196,208,232,.75), rgba(196,208,232,0)); }
      #w3 { left: 1480px; top: -200px; width: 820px; height: 640px; background: radial-gradient(closest-side, rgba(238,200,200,.70), rgba(238,200,200,0)); }
      #w4 { left: 1400px; top: 620px; width: 900px; height: 700px; background: radial-gradient(closest-side, rgba(208,222,192,.80), rgba(208,222,192,0)); }

      /* ---------- the medallion: every layer shares the same 940px box ---------- */
      #stage { position: absolute; left: 490px; top: 70px; width: 940px; height: 940px; }
      #stage img { position: absolute; left: 0; top: 0; width: 940px; height: 940px; display: block; }
      #stage img.num { left: auto; top: auto; }
      #shine { position: absolute; left: 0; top: 0; width: 940px; height: 940px; border-radius: 50%; overflow: hidden; pointer-events: none; }
      #shine i { position: absolute; top: -200px; left: -300px; width: 150px; height: 1340px; transform-origin: 50% 50%;
                 background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,250,235,.55), rgba(255,255,255,0)); }

      #ring { --a: -4deg;
        -webkit-mask-image: conic-gradient(from 0deg at 49.44% 48.96%, #000 var(--a), transparent calc(var(--a) + 3deg));
                mask-image: conic-gradient(from 0deg at 49.44% 48.96%, #000 var(--a), transparent calc(var(--a) + 3deg)); }
      #title, #subtitle { --p: -14%;
        -webkit-mask-image: linear-gradient(to left, #000 var(--p), transparent calc(var(--p) + 14%));
                mask-image: linear-gradient(to left, #000 var(--p), transparent calc(var(--p) + 14%)); }

      /* ---------- ambient floaters ---------- */
      #fx { position: absolute; inset: 0; pointer-events: none; }
      .sp { position: absolute; width: 10px; height: 10px; border-radius: 50%; opacity: 0;
            background: radial-gradient(closest-side, #f6dc9a, rgba(212,170,80,.0)); }
      .ht { position: absolute; width: 30px; height: 30px; opacity: 0; }
      .ht svg { width: 100%; height: 100%; display: block; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="9.6" data-width="1920" data-height="1080">
      <div id="bg">
        <div class="wash" id="w1" data-layout-allow-overflow></div>
        <div class="wash" id="w2" data-layout-allow-overflow></div>
        <div class="wash" id="w3" data-layout-allow-overflow></div>
        <div class="wash" id="w4" data-layout-allow-overflow></div>
      </div>
      <div id="fx"></div>

      <div id="stage">
        <img id="disc" src="assets/disc.png" alt="" />
        <img id="portrait" src="assets/portrait.png" alt="" />
        <img id="ring" src="assets/ring.png" alt="" />
        <img id="n90" class="num" src="assets/n90.png" alt="" style="left:67.5px;top:176.25px;width:225px;height:183.75px" />
        <img id="n95" class="num" src="assets/n95.png" alt="" style="left:660px;top:176.25px;width:210px;height:183.75px" />
        <img id="title" src="assets/title.png" alt="" />
        <img id="subtitle" src="assets/subtitle.png" alt="" />
        <img id="orn_l" src="assets/orn_l.png" alt="" />
        <img id="orn_r" src="assets/orn_r.png" alt="" />
        <img id="orn_h" src="assets/orn_h.png" alt="" />
        <div id="shine"><i id="band" data-layout-allow-overflow></i></div>
      </div>
    </div>

    <script>
      // deterministic pseudo-random (seeded) for the floating sparkles / hearts
      function rng(seed) { return function () { seed |= 0; seed = (seed + 0x6d2b79f5) | 0; let t = Math.imul(seed ^ (seed >>> 15), 1 | seed); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
      const R = rng(2026);
      const fx = document.getElementById("fx");
      const HEART = '<svg viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.2C.9 8.4 3 5 6.3 5c2 0 3.6 1.1 4.4 2.6h.6C12.1 6.1 13.7 5 15.7 5 19 5 21.1 8.4 19.6 11.8 17.5 16.4 12 21 12 21z" fill="currentColor"/></svg>';

      const sparks = [], hearts = [];
      for (let i = 0; i < 34; i++) {
        const d = document.createElement("div"); d.className = "sp";
        const s = 6 + R() * 12; d.style.width = d.style.height = s + "px";
        // keep sparkles out of the centre of the medallion, favour the wide side margins
        const side = R() < 0.5 ? 0 : 1;
        const x = side ? 1440 + R() * 440 : 40 + R() * 420;
        const y = 60 + R() * 960;
        d.style.left = x + "px"; d.style.top = y + "px";
        fx.appendChild(d); sparks.push({ d, x, y, t: R() * 5.2, dur: 2.6 + R() * 2.2, rise: 60 + R() * 120 });
      }
      const heartCols = ["#d98a8a", "#c9a24d", "#e3a9a9", "#a9b894"];
      for (let i = 0; i < 9; i++) {
        const d = document.createElement("div"); d.className = "ht";
        d.innerHTML = HEART; d.style.color = heartCols[i % heartCols.length];
        const s = 22 + R() * 26; d.style.width = d.style.height = s + "px";
        const side = i % 2;
        const x = side ? 1470 + R() * 360 : 70 + R() * 340;
        const y = 560 + R() * 420;
        d.style.left = x + "px"; d.style.top = y + "px";
        fx.appendChild(d); hearts.push({ d, t: 3.4 + i * 0.55, dur: 3.4 + R() * 1.4, rise: 260 + R() * 160, sway: (R() - .5) * 70 });
      }

      const tl = gsap.timeline({ paused: true });

      // 0 — washes bloom in
      tl.fromTo(".wash", { opacity: 0, scale: 1.25 }, { opacity: 1, scale: 1, duration: 1.8, ease: "power2.out", stagger: 0.12 }, 0);
      tl.to(".wash", { x: 30, y: -16, duration: 9.6, ease: "none" }, 0);

      // 0.3 — paper medallion
      tl.fromTo("#disc", { opacity: 0, scale: 0.9 }, { opacity: 1, scale: 1, duration: 1.1, ease: "power3.out", transformOrigin: "50% 50%" }, 0.3);

      // 0.5 — gold ring draws itself clockwise from the top
      tl.fromTo("#ring", { "--a": "-4deg" }, { "--a": "364deg", duration: 2.0, ease: "power2.inOut" }, 0.5);

      // 1.3 — the couple emerges from the watercolour
      tl.fromTo("#portrait", { opacity: 0, scale: 1.08, y: 22, filter: "blur(18px)" },
        { opacity: 1, scale: 1, y: 0, filter: "blur(0px)", duration: 1.7, ease: "power3.out", transformOrigin: "50% 60%" }, 1.3);

      // 2.7 / 3.0 — the ages
      tl.fromTo("#n90", { opacity: 0, y: 34, scale: 0.88, filter: "blur(10px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 1.0, ease: "back.out(1.5)", transformOrigin: "50% 60%" }, 2.7);
      tl.fromTo("#n95", { opacity: 0, y: 34, scale: 0.88, filter: "blur(10px)" },
        { opacity: 1, y: 0, scale: 1, filter: "blur(0px)", duration: 1.0, ease: "back.out(1.5)", transformOrigin: "50% 60%" }, 3.0);

      // 3.9 — "חוגגים יחד" wipes in right-to-left, then "יום הולדת"
      tl.fromTo("#title", { "--p": "-14%", opacity: 1 }, { "--p": "100%", duration: 1.0, ease: "power2.inOut" }, 3.9);
      tl.fromTo("#title", { y: 14 }, { y: 0, duration: 1.0, ease: "power2.out" }, 3.9);
      tl.fromTo("#subtitle", { "--p": "-14%", opacity: 1 }, { "--p": "100%", duration: 0.9, ease: "power2.inOut" }, 4.55);
      tl.fromTo("#subtitle", { y: 12 }, { y: 0, duration: 0.9, ease: "power2.out" }, 4.55);

      // 5.3 — ornament: heart pops, lines grow outward
      tl.fromTo("#orn_h", { opacity: 0, scale: 0.2, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.7, ease: "back.out(2.4)" }, 5.3);
      tl.fromTo("#orn_l", { clipPath: "inset(0 0 0 100%)" }, { clipPath: "inset(0 0 0 0%)", duration: 0.8, ease: "power2.out" }, 5.45);
      tl.fromTo("#orn_r", { clipPath: "inset(0 100% 0 0)" }, { clipPath: "inset(0 0% 0 0)", duration: 0.8, ease: "power2.out" }, 5.45);
      // heart beats twice while the piece holds
      tl.to("#orn_h", { scale: 1.22, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 6.3);
      tl.to("#orn_h", { scale: 1.22, duration: 0.22, ease: "power2.out", yoyo: true, repeat: 1 }, 6.85);

      // 6.0 — one soft light sweep across the medallion
      tl.set("#band", { rotation: 18 }, 0);
      tl.fromTo("#band", { x: 0 }, { x: 1500, duration: 1.5, ease: "power1.inOut" }, 6.0);

      // slow push-in on the whole medallion
      tl.fromTo("#stage", { scale: 1 }, { scale: 1.035, duration: 8.6, ease: "none", transformOrigin: "50% 50%" }, 0.5);

      // ambient sparkles + drifting hearts
      sparks.forEach(function (s) {
        tl.fromTo(s.d, { opacity: 0, y: 0, scale: 0.4 }, { opacity: 0.9, y: -s.rise * 0.5, scale: 1, duration: s.dur * 0.5, ease: "sine.out" }, 0.8 + s.t);
        tl.to(s.d, { opacity: 0, y: -s.rise, scale: 0.5, duration: s.dur * 0.5, ease: "sine.in" }, 0.8 + s.t + s.dur * 0.5);
      });
      hearts.forEach(function (h) {
        tl.fromTo(h.d, { opacity: 0, y: 0, x: 0, scale: 0.6, rotation: -8 }, { opacity: 0.75, y: -h.rise * 0.4, x: h.sway * 0.5, scale: 1, rotation: 6, duration: h.dur * 0.4, ease: "sine.out" }, h.t);
        tl.to(h.d, { opacity: 0, y: -h.rise, x: h.sway, scale: 0.9, rotation: -4, duration: h.dur * 0.6, ease: "sine.in" }, h.t + h.dur * 0.4);
      });

      // 8.7 — gentle exit to cream, ready to cut into the family video
      tl.to("#stage", { opacity: 0, filter: "blur(6px)", duration: 0.8, ease: "power2.in" }, 8.7);
      tl.to("#fx, #bg", { opacity: 0, duration: 0.8, ease: "power1.in" }, 8.7);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
