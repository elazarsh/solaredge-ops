# פרסום ״הסטודיו של חדר המורים״ ב־GitHub Pages. מופעל ידנית בלבד.
# דרישה חד־פעמית: Settings ← Pages ← Source: GitHub Actions (נדרש בעל הרשאת Admin).
name: Teachers Studio Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: teachers-studio-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build downloads
        run: node teachers-studio/build.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: teachers-studio/site
      - id: deployment
        uses: actions/deploy-pages@v4
