function jagPoly(w,h,seed){const pts=[];const n=Math.ceil(w/46);for(let i=0;i<=n;i++)pts.push([Math.min(w,i*46),(rnd(seed+i)-.5)*10+3]);for(let i=0;i<=Math.ceil(h/46);i++)pts.push([w-(rnd(seed+50+i)-.5)*8-2,Math.min(h,i*46)]);for(let i=n;i>=0;i--)pts.push([Math.min(w,i*46),h-(rnd(seed+90+i)-.5)*10-3]);for(let i=Math.ceil(h/46);i>=0;i--)pts.push([(rnd(seed+130+i)-.5)*8+2,Math.min(h,i*46)]);return 'polygon('+pts.map(p=>p[0].toFixed(1)+'px '+p[1].toFixed(1)+'px').join(',')+')'}

tableScene(24.6,29.3,{k:'tear',d:.5,up:false,seed:4},{build:(el,s)=>{s.st=strip('השאלה',700,210,'#fbf0dd','#14121a',160,el,21);s.st.style.boxShadow='none';s.svg=document.createElementNS('http://www.w3.org/2000/svg','svg');s.svg.setAttribute('width',W);s.svg.setAttribute('height',H);el.appendChild(s.svg);s.el=document.createElementNS('http://www.w3.org/2000/svg','ellipse');s.el.setAttribute('cx',540);s.el.setAttribute('cy',985);s.el.setAttribute('rx',215);s.el.setAttribute('ry',170);s.el.setAttribute('fill','none');s.el.setAttribute('stroke','#e8571f');s.el.setAttribute('stroke-width','11');s.el.setAttribute('stroke-linecap','round');s.svg.appendChild(s.el)},
