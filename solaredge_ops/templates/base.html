<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SolarEdge Ops{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    /*
     * Color system — GitHub Dark palette (battle-tested, WCAG AA/AAA)
     * ─────────────────────────────────────────────────────────────────
     * Backgrounds (darkest → lightest):
     *   page    #0d1117   ← body
     *   surface #161b22   ← cards
     *   raised  #1c2128   ← card headers, table head
     *   hover   #21262d   ← row hover, active nav
     *   border  #30363d
     *
     * Text (highest → lowest contrast on #161b22):
     *   primary   #f0f6fc   15:1  headings, values       AAA
     *   secondary #c9d1d9    9:1  body paragraphs        AAA
     *   tertiary  #8b949e   4.9:1 labels, meta, col hdr  AA
     *   muted     #6e7681   3.2:1 placeholders only (not body text)
     *
     * Accent:
     *   yellow  #e3b341   8.4:1 on #0d1117  ← page titles, active nav
     *   blue    #58a6ff   7.0:1             ← info
     *   green   #3fb950                     ← success/ok
     *   red     #f85149                     ← critical
     *   orange  #d29922                     ← warning
     */

    /* ─── Base ─── */
    body { background: #0d1117; color: #c9d1d9; font-family: 'Segoe UI', system-ui, sans-serif; font-size: 0.94rem; }

    /* ─── Sidebar ─── */
    .sidebar { width: 230px; min-height: 100vh; background: #161b22; border-left: 1px solid #30363d; padding-top: 1.5rem; position: fixed; right: 0; top: 0; }
    .sidebar .brand { padding: 0 1.25rem 1.5rem; border-bottom: 1px solid #30363d; margin-bottom: 0.5rem; }
    .sidebar .brand h5 { color: #e3b341; margin: 0; font-weight: 700; }
    .sidebar .brand small { color: #8b949e; font-size: 0.75rem; }
    /* nav links — tertiary text (4.9:1) → yellow on active */
    .nav-link { color: #8b949e; padding: 0.65rem 1.25rem; border-radius: 7px; margin: 2px 8px; display: flex; align-items: center; gap: 10px; font-size: 0.92rem; transition: background .12s, color .12s; }
    .nav-link:hover  { background: #21262d; color: #c9d1d9; }
    .nav-link.active { background: #21262d; color: #e3b341; font-weight: 600; }
    .nav-link i { font-size: 1.05rem; }

    /* ─── Layout ─── */
    .main-content { margin-right: 230px; padding: 2rem 2.25rem; }

    /* ─── Cards ─── */
    .card { background: #161b22; border: 1px solid #30363d; border-radius: 10px; }
    .card-header {
      background: #1c2128;
      border-bottom: 1px solid #30363d;
      padding: 0.85rem 1.25rem;
      color: #f0f6fc;        /* primary text — max contrast for headings */
      font-size: 0.95rem;
      font-weight: 600;
    }

    /* ─── Stat cards ─── */
    .stat-card { border-radius: 10px; padding: 1.5rem; position: relative; overflow: hidden; }
    .stat-card .stat-value { font-size: 2.2rem; font-weight: 700; line-height: 1; color: #f0f6fc; }
    .stat-card .stat-label { font-size: 0.72rem; color: #8b949e; margin-top: 6px; text-transform: uppercase; letter-spacing: .07em; font-weight: 600; }
    .stat-card .stat-icon { position: absolute; left: 1.25rem; top: 50%; transform: translateY(-50%); font-size: 2.5rem; opacity: 0.1; color: #f0f6fc; }

    /* ─── Severity badges ─── */
    .badge-critical { background: #490202; color: #f85149; border: 1px solid #f85149; }
    .badge-warning  { background: #3a2200; color: #e3b341; border: 1px solid #e3b341; }
    .badge-info     { background: #0c2d6b; color: #58a6ff; border: 1px solid #58a6ff; }

    /* ─── Table ─── */
    .table { color: #c9d1d9; }
    .table thead th {
      background: #1c2128;
      border-bottom: 2px solid #30363d;
      color: #8b949e;         /* tertiary — 4.9:1 on #1c2128, AA compliant */
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: .08em;
      padding: 0.65rem 0.75rem;
    }
    .table tbody tr { border-bottom: 1px solid #21262d; }
    .table tbody tr:hover { background: #21262d; }
    .table td { padding: 0.6rem 0.75rem; vertical-align: middle; }
    .table th { vertical-align: middle; }

    /* ─── Pills / tags ─── */
    .pill { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.71rem; font-weight: 700; border: 1px solid transparent; }
    .pill-telegram { background: #0c2d6b; color: #58a6ff; border-color: #1a4080; }
    .pill-email    { background: #0d2e18; color: #3fb950; border-color: #1a5030; }
    .pill-rule     { background: #1c2128; color: #8b949e; border-color: #30363d; }

    /* ─── Misc ─── */
    .no-config-banner { background: #161b22; border: 1px dashed #30363d; border-radius: 10px; padding: 3rem; text-align: center; }
    .secret-mask  { font-family: monospace; color: #484f58; letter-spacing: 3px; font-size: 1rem; }

    /* ─── Severity text colors ─── */
    .sev-critical { color: #f85149; }
    .sev-warning  { color: #e3b341; }
    .sev-info     { color: #58a6ff; }

    /* ─── Status dots ─── */
    .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-left: 5px; flex-shrink: 0; }
    .dot-ok   { background: #3fb950; box-shadow: 0 0 6px rgba(63,185,80,.6); }
    .dot-warn { background: #e3b341; }
    .dot-bad  { background: #f85149; box-shadow: 0 0 6px rgba(248,81,73,.5); }

    /* ─── Typography ─── */
    .page-title { font-size: 1.35rem; font-weight: 700; margin-bottom: 1.75rem; color: #e3b341; }
    /* secondary/meta text — AA compliant (4.9:1) */
    .ts { font-size: 0.77rem; color: #8b949e; }
    /* explicit label class used in cards */
    .label-text { color: #8b949e; font-size: 0.78rem; font-weight: 600; text-transform: uppercase; letter-spacing: .05em; margin-bottom: 2px; }
    strong, b { color: #f0f6fc; }
  </style>
</head>
<body>
<nav class="sidebar">
  <div class="brand">
    <h5><i class="bi bi-sun-fill"></i> SolarEdge Ops</h5>
    <small>ניטור ויידוע מתקנים</small>
  </div>
  <a href="/" class="nav-link {% if active=='dashboard' %}active{% endif %}">
    <i class="bi bi-speedometer2"></i> לוח בקרה
  </a>
  <a href="/alerts" class="nav-link {% if active=='alerts' %}active{% endif %}">
    <i class="bi bi-bell-fill"></i> התראות פעילות
    {% if open_count %}<span class="badge bg-danger ms-auto">{{ open_count }}</span>{% endif %}
  </a>
  <a href="/contacts" class="nav-link {% if active=='contacts' %}active{% endif %}">
    <i class="bi bi-people-fill"></i> נמענים
  </a>
  <a href="/config" class="nav-link {% if active=='config' %}active{% endif %}">
    <i class="bi bi-gear-fill"></i> קונפיגורציה
  </a>
  <div style="height:1px;background:#30363d;margin:8px 14px"></div>
  <a href="/analytics/" class="nav-link {% if active=='analytics' %}active{% endif %}">
    <i class="bi bi-graph-up-arrow"></i> ניתוח נתונים
  </a>
</nav>
<main class="main-content">
  {% block content %}{% endblock %}
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
